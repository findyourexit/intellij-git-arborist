name: Release

on:
  workflow_dispatch:
    inputs:
      publish_to_marketplace:
        description: 'Publish to JetBrains Marketplace (requires PUBLISH_TOKEN secret)'
        required: false
        type: boolean
        default: false
  push:
    tags:
      # Bare semver, matching the tags and GitHub releases already published (0.1.0, 0.1.1) and
      # the compare links in CHANGELOG.md. A "v"-prefixed pattern was used here previously and
      # never matched, so this workflow had never run and both prior releases were hand-made.
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Build & release
    runs-on: ubuntu-latest
    # Expose secrets as job-level env vars. A tag build asserts PUBLISH_TOKEN is present in the
    # first step below; CERTIFICATE_CHAIN / PRIVATE_KEY / PRIVATE_KEY_PASSWORD are read by the
    # Gradle `signing {}` block so `publishPlugin` signs the artifact before upload. Absent
    # signing secrets simply skip signing rather than failing the build.
    env:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
    steps:
      # Checked before anything expensive runs. The publish step below is guarded on PUBLISH_TOKEN
      # being non-empty, and a skipped step does not fail a run — so without this assertion a tag
      # build would report success having uploaded nothing to the Marketplace.
      - name: Require a publish token for tag builds
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error title=Missing PUBLISH_TOKEN::Tag ${{ github.ref_name }} cannot be published to the JetBrains Marketplace. Generate a token at https://plugins.jetbrains.com/author/me/tokens, add it as the PUBLISH_TOKEN repository secret, then re-run. Use workflow_dispatch if you meant to build without publishing."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build plugin distribution
        run: ./gradlew buildPlugin

      # Gate the release on the JetBrains Plugin Verifier so a tag can never publish an
      # artifact that was not checked against the target IDEs (ci.yml does not run on tags).
      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin

      - name: Upload plugin ZIP as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: git-arborist-${{ github.ref_name }}
          path: build/distributions/*.zip
          if-no-files-found: error
          # Without this a re-run fails: uploading a name that already exists is an error.
          overwrite: true

      # Create-or-update rather than create: `gh release create` errors when the release already
      # exists, which on a re-run would abort the job here and never reach the publish step below.
      - name: Create or update the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its assets."
            gh release upload "$TAG" build/distributions/*.zip --clobber
          else
            gh release create "$TAG" \
              --title "Git Arborist $TAG" \
              --generate-notes \
              build/distributions/*.zip
          fi

      # Publishes to JetBrains Marketplace when PUBLISH_TOKEN is present and either:
      #   - a version tag triggered the run, or
      #   - workflow_dispatch was used with publish_to_marketplace: true
      - name: Publish to JetBrains Marketplace
        if: >
          env.PUBLISH_TOKEN != '' &&
          (
            startsWith(github.ref, 'refs/tags/') ||
            (github.event_name == 'workflow_dispatch' && inputs.publish_to_marketplace)
          )
        run: ./gradlew publishPlugin

      # Fold [Unreleased] into a dated section for the tag just published, then push that back to
      # main so the next cycle starts from a clean [Unreleased]. `patchChangelog` is idempotent, so
      # this is a no-op when the changelog was already cut in the release commit.
      - name: Cut the changelog and push it back to main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          ./gradlew patchChangelog
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is already cut for ${{ github.ref_name }}; nothing to commit."
            exit 0
          fi
          git commit -m "docs(changelog): cut ${{ github.ref_name }}" -- CHANGELOG.md
          git push origin main